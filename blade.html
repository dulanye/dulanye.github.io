<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>刀尖突围 · 蓝夜渡舟</title>

    <style>

        body {

            margin: 0;

            background: #f5f3ef;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }


        .page {

            max-width: 900px;

            margin: 0 auto;

            padding: 90px 30px 120px;
        }


        /* 返回首页 */

        .back {

            display: inline-block;

            margin-bottom: 80px;

            color: #888;

            text-decoration: none;

            font-size: 13px;

            letter-spacing: 2px;
        }


        .back:hover {

            color: #222;
        }


        /* 栏目标题 */

        h1 {

            margin: 0;

            font-size: 40px;

            font-weight: 400;

            letter-spacing: 6px;
        }


        .description {

            margin-top: 20px;

            margin-bottom: 80px;

            color: #999;

            font-size: 14px;

            line-height: 1.8;
        }


        /* 文章列表 */

        .article-list {

            border-top: 1px solid #ddd;
        }


        .article {

            display: block;

            padding: 35px 0;

            border-bottom: 1px solid #ddd;

            color: #222;

            text-decoration: none;
        }


        .article:hover {

            opacity: 0.55;
        }


        .article-number {

            margin-bottom: 12px;

            color: #999;

            font-size: 12px;

            letter-spacing: 2px;
        }


        .article-title {

            font-size: 22px;

            font-weight: 400;

            line-height: 1.5;
        }


        .article-intro {

            margin-top: 12px;

            color: #777;

            font-size: 14px;

            line-height: 1.8;
        }


        /* 手机端 */

        @media (max-width: 600px) {

            .page {

                padding:
                    60px 24px 90px;
            }


            h1 {

                font-size: 32px;
            }


            .article-title {

                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <main class="page">


        <!-- 返回首页 -->

        <a class="back"
           href="index.html">

            ← 蓝夜渡舟

        </a>


        <!-- 栏目标题 -->

        <h1>

            刀尖突围

        </h1>


        <div class="description">

            一月一会。

        </div>


        <!-- 文章列表 -->

        <div class="article-list">


            <!-- 以后每个月在这里增加一篇 -->


        </div>


    </main>


</body>

</html>
