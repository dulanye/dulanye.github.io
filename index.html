<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>蓝夜渡舟</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            background: #000;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }


        /* =================================================
           电脑端首页
           ================================================= */

        .desktop-home {

            width: 100%;
            max-width: 1400px;

            margin: 0 auto;

            position: relative;
        }


        .desktop-home img {

            width: 100%;
            height: auto;

            display: block;
        }


        /* 蓝夜渡舟 */

        .desktop-title {

            position: absolute;

            top: 18%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            font-size: 42px;
            font-weight: 400;

            letter-spacing: 10px;

            white-space: nowrap;

            z-index: 10;
        }


        /* 三个栏目 */

        .desktop-menu {

            position: absolute;

            bottom: 12%;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 40px;

            font-size: 14px;

            letter-spacing: 4px;

            white-space: nowrap;

            z-index: 10;
        }


        .desktop-menu a {

            color: white;

            text-decoration: none;

            display: block;

            padding: 10px 15px;

            transition:
                opacity 0.3s ease;
        }


        .desktop-menu a:hover {

            opacity: 0.55;
        }


        /* =================================================
           手机端默认隐藏
           ================================================= */

        .mobile-home {

            display: none;
        }


        /* =================================================
           手机端
           ================================================= */

        @media (max-width: 600px) {


            /* 隐藏电脑端 */

            .desktop-home {

                display: none;
            }


            /* 显示手机端 */

            .mobile-home {

                display: block;

                width: 100%;
            }


            /* ---------------------------------------------
               顶部黑色区域
               --------------------------------------------- */

            .mobile-title {

                height: 180px;

                display: flex;

                align-items: center;
                justify-content: center;

                background: #000;
            }


            .mobile-title h1 {

                margin: 0;

                color: white;

                font-size: 28px;

                font-weight: 400;

                letter-spacing: 6px;
            }


            /* ---------------------------------------------
               海边照片
               --------------------------------------------- */

            .mobile-photo {

                width: 100%;

                background: #000;
            }


            .mobile-photo img {

                width: 100%;

                height: auto;

                display: block;
            }


            /* ---------------------------------------------
               三个栏目
               --------------------------------------------- */

            .mobile-menu {

                min-height: 220px;

                display: flex;

                align-items: center;
                justify-content: center;

                gap: 15px;

                background: #000;

                flex-wrap: wrap;
            }


            .mobile-menu a {

                color: white;

                text-decoration: none;

                font-size: 13px;

                letter-spacing: 3px;

                padding: 15px 8px;

                transition:
                    opacity 0.3s ease;
            }


            .mobile-menu a:hover {

                opacity: 0.55;
            }


            /* ---------------------------------------------
               页面底部
               --------------------------------------------- */

            .mobile-bottom {

                min-height: 300px;

                background: #000;
            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         电脑端
         ================================================= -->

    <div class="desktop-home">


        <!-- 海边胶片照片 -->

        <img src="sea.jpg"
             alt="海边胶片照片">


        <!-- 网站名称 -->

        <div class="desktop-title">

            蓝夜渡舟

        </div>


        <!-- 三个栏目 -->

        <nav class="desktop-menu">

            <a href="travel.html">
                荒原漫游
            </a>

            <a href="oyster.html">
                牡蛎之外
            </a>

            <a href="blade.html">
                刀尖突围
            </a>

        </nav>


    </div>



    <!-- =================================================
         手机端
         ================================================= -->

    <div class="mobile-home">


        <!-- 顶部 -->

        <section class="mobile-title">

            <h1>
                蓝夜渡舟
            </h1>

        </section>


        <!-- 完整照片 -->

        <section class="mobile-photo">

            <img src="sea.jpg"
                 alt="海边胶片照片">

        </section>


        <!-- 三个栏目 -->

        <nav class="mobile-menu">

            <a href="travel.html">
                荒原漫游
            </a>

            <a href="oyster.html">
                牡蛎之外
            </a>

            <a href="blade.html">
                刀尖突围
            </a>

        </nav>


        <!-- 底部留白 -->

        <section class="mobile-bottom">
        </section>


    </div>


</body>

</html>
